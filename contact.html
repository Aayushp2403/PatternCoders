<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Pattern Coders</title>
    <meta
      name="description"
      content="Contact Pattern Coders by email about your next website, software, sales, or marketing project."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Syne:wght@500;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="noise"></div>
      <header class="site-header">
        <a class="brand" href="index.html">
          <span class="brand-mark"></span>
          <span>Pattern Coders</span>
        </a>
        <nav class="site-nav">
          <a href="index.html#services">Services</a>
          <a href="index.html#work">Work</a>
          <a href="index.html#founders">Founders</a>
          <a href="index.html#process">Process</a>
          <a href="contact.html" class="active">Contact</a>
        </nav>
      </header>

      <main>
        <section class="section contact-hero">
          <div class="section-heading reveal">
            <p class="eyebrow">Contact us</p>
            <h1>Talk to the Pattern Coders team.</h1>
            <p class="hero-text">
              For all project inquiries, reach us directly by email.
            </p>
          </div>
        </section>

        <section class="section contact-section">
          <div class="contact-grid">
            <article class="contact-card reveal">
              <p class="founder-role">Email contact</p>
              <h2>Pattern Coders</h2>
              <p>Send us a message and we will get back to you soon.</p>
              <div class="contact-actions">
                <a
                  class="button button-primary"
                  href="mailto:coderpattern@gmail.com"
                >
                  coderpattern@gmail.com
                </a>
              </div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
